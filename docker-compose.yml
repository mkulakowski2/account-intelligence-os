services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: account_intel
      # Local development default only — do NOT use in production. Override with a secret.
      POSTGRES_PASSWORD: account_intel
      POSTGRES_DB: account_intel
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
